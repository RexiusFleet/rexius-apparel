# Minimal Supabase CLI config for this repo.
# `supabase link --project-ref hibjqcgitqtgmkurghlw` fills in the rest locally.
project_id = "rexius-apparel"

[functions.admin-users]
# The function verifies the caller's JWT itself (see index.ts) and also checks
# that the caller is an active admin in apparel_app_users. Turning off gateway
# verification lets the browser's CORS preflight (which carries no
# Authorization header) reach the function.
verify_jwt = false

[functions.invoice-extract]
# Same arrangement as admin-users: the function verifies the caller's JWT
# itself and requires an active admin. Needs the ANTHROPIC_API_KEY_APPAREL secret.
verify_jwt = false

[functions.low-stock-alert]
# Called by the database through pg_net, which has no user token to send.
# The function trusts nothing in the request: it only sends low-stock emails
# already queued in apparel.low_stock_alerts. Needs the GMAIL_ADDRESS_APPAREL
# and GMAIL_APP_PASSWORD_APPAREL secrets.
verify_jwt = false
